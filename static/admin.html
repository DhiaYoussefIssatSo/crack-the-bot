<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crack the Bot, admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin">
  <div class="shell">
    <h1>Admin</h1>
    <p id="health" class="status-line" role="status">Vérification du gardien…</p>

    <form id="token-form" class="row" autocomplete="off">
      <label for="token" class="sr-only">Jeton admin</label>
      <input id="token" type="password" placeholder="Jeton admin (affiché dans le terminal au lancement)">
      <button class="btn" type="submit">Charger le classement</button>
    </form>
    <p id="msg" class="msg" role="status"></p>

    <div class="actions">
      <button id="reload-btn" class="btn btn-alt" type="button">Actualiser</button>
      <button id="reset-btn" class="btn btn-danger" type="button">Vider le classement</button>
    </div>

    <table>
      <thead><tr><th scope="col">Place</th><th scope="col">Joueur</th><th scope="col">Niveaux</th><th scope="col">Points</th><th scope="col">Heure</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script type="module" src="/static/admin.js"></script>
</body>
</html>
